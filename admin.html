<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理後台 — 海德堡讀書會</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
body{margin:0;padding:16px;background:#faf6ef;font-family:sans-serif;font-size:16px;color:#3d3226}
.wrap{max-width:700px;margin:0 auto}
h1{font-size:22px;font-weight:700;text-align:center;margin-bottom:4px}
.sub{text-align:center;font-size:12px;letter-spacing:.4em;color:#a8874f;margin-bottom:20px}
.box{background:#fff;border:2px solid #c9a86a;border-radius:14px;padding:24px 20px;margin-bottom:16px}
.box-title{font-size:16px;font-weight:700;color:#a8874f;margin-bottom:14px;border-bottom:1px solid #e8d9c0;padding-bottom:8px}
label{display:block;font-size:14px;font-weight:700;margin:10px 0 4px}
input,select,textarea{width:100%;box-sizing:border-box;font-size:16px;padding:10px 12px;border:1.5px solid #c8aa80;border-radius:8px;background:#fff;color:#3d3226;outline:none}
input:focus,select:focus{border-color:#a8874f}
.btn{display:block;width:100%;margin-top:12px;padding:13px;font-size:16px;font-weight:700;color:#fff;background:#a8874f;border:none;border-radius:10px;cursor:pointer}
.btn:hover{background:#8a6e3f}
.btn-sm{width:auto;display:inline-block;padding:8px 16px;font-size:14px;margin-top:0;margin-right:8px}
.btn-outline{background:#fff;color:#a8874f;border:1.5px solid #a8874f}
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}
.tab{flex-shrink:0;padding:9px 16px;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;border:1.5px solid #c8aa80;background:#fff;color:#8a7a63}
.tab.active{background:#a8874f;color:#fff;border-color:#a8874f}
.grid3{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px;text-align:center}
.grid4{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;text-align:center}
.badge-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:14px}
.badge-card{background:#faf6ef;border:1px solid #ddd0b8;border-radius:12px;padding:14px 10px;text-align:center;position:relative;break-inside:avoid}
.badge-num{position:absolute;top:4px;right:7px;font-size:10px;color:#ddd}
.badge-name{font-size:17px;font-weight:700;color:#3d3226;margin-bottom:8px}
.badge-qr{display:flex;justify-content:center;margin-bottom:6px}
.badge-phone{font-size:12px;color:#8a7a63}
.badge-org{font-size:10px;color:rgba(140,120,90,.4);letter-spacing:.3em;margin-top:3px}
.from-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:14px}
.from-row input{width:70px;padding:7px 10px;border:1.5px solid #c8aa80;border-radius:8px;font-size:14px}
.from-row button{padding:7px 14px;background:#a8874f;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer}
@media print{
  @page{size:A4 portrait;margin:10mm}
  body{padding:0;background:#fff}
  .wrap>*:not(#main){display:none!important}
  #main>*:not(#tab-print){display:none!important}
  .tabs,.btn,.btn-sm,.from-row,#batch-count{display:none!important}
  #tab-print .box-title{display:none!important}
  .badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6mm}
  .badge-card{border:1px solid #ccc;border-radius:6px;padding:6mm 4mm}
  .badge-name{font-size:14px}
  .badge-phone{font-size:11px}
  .badge-org{font-size:9px}
}
.stat{background:#f5f0e8;border:1px solid #ddd0b8;border-radius:10px;padding:10px}
.stat .n{font-size:26px;font-weight:700}
.stat .l{font-size:12px;color:#8a7a63}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
th{background:#f5ece0;color:#a8874f;font-weight:700;padding:8px;text-align:left;border-bottom:2px solid #c8aa80}
td{padding:8px;border-bottom:1px solid #e8ddd0}
.ok{color:#4a7c59;font-weight:700}.no{color:#8a7a63}
.msg{display:none;margin-top:10px;padding:10px 12px;border-radius:8px;font-size:14px}
.msg.show{display:block}
.msg.ok-msg{background:#e8f4ec;border:1px solid #4a7c59;color:#4a7c59}
.msg.err-msg{background:#faeaea;border:1px solid #c05050;color:#c05050}
#main{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="sub">臺中市海德堡讀書會</div>
  <h1>管理後台</h1>

  <!-- 登入 -->
  <div id="login" class="box" style="margin-top:24px">
    <div class="box-title">輸入管理密碼</div>
    <label>密碼</label>
    <input type="password" id="pass-input" placeholder="請輸入密碼" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn" onclick="doLogin()">登入</button>
    <div class="msg" id="login-msg"></div>
  </div>

  <!-- 主要內容 -->
  <div id="main">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('event')">📋 本次活動</div>
      <div class="tab" onclick="switchTab('members')">👥 會員名冊</div>
      <div class="tab" onclick="switchTab('setup')">⚙️ 活動管理</div>
      <div class="tab" onclick="switchTab('stats')">📊 出席統計</div>
      <div class="tab" onclick="switchTab('print')">🖨️ 批次列印</div>
    </div>

    <!-- 活動名單 -->
    <div id="tab-event">
      <div class="box">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">
          <div class="box-title" id="event-title" style="margin-bottom:0;flex:1;min-width:120px">本次活動名單</div>
          <select id="event-select" onchange="switchEvent(this.value)" style="font-size:14px;padding:7px 10px;border:1.5px solid #c8aa80;border-radius:8px;background:#fff;color:#3d3226;max-width:180px">
            <option value="">載入中…</option>
          </select>
        </div>
        <div class="grid4">
          <div class="stat"><div class="n" id="st-total">0</div><div class="l">總填表人數</div></div>
          <div class="stat"><div class="n" id="st-attend" style="color:#4a7c59">0</div><div class="l">出席人數</div></div>
          <div class="stat"><div class="n" id="st-absent" style="color:#8a7a63">0</div><div class="l">請假人數</div></div>
          <div class="stat"><div class="n" id="st-meal" style="color:#a8874f">0</div><div class="l">需備餐（含加購）</div></div>
          <div class="stat"><div class="n" id="st-checked" style="color:#4a7c59">0</div><div class="l">當天出席人數</div></div>
        </div>
        <div id="birthday-box" style="display:none;background:#fff8e6;border:1.5px solid #e6a817;border-radius:10px;padding:12px 16px;margin-bottom:12px">
          <div style="font-weight:700;color:#7a5500;margin-bottom:6px">🎂 本月壽星</div>
          <div id="birthday-list" style="font-size:14px;color:#5a3d00;line-height:2"></div>
        </div>
        <div style="margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-sm btn-outline" onclick="loadGuests()">重新整理</button>
          <button class="btn btn-sm btn-outline" onclick="exportGuestsCSV()">📥 匯出 CSV</button>
        </div>
        <div class="tbl">
          <table id="event-table">
            <tr><th>#</th><th>姓名</th><th>電話</th><th>出席</th><th>用餐</th><th>加購</th><th>備註</th><th>報到</th></tr>
          </table>
        </div>
      </div>
    </div>

    <!-- 會員名冊 -->
    <div id="tab-members" style="display:none">
      <div class="box">
        <div class="box-title">匯入現有名單 → 會員名冊</div>
        <p style="font-size:13px;color:#8a7a63;margin-bottom:10px">輸入試算表分頁名稱，將報名者新增至會員名冊</p>
        <label>活動分頁名稱</label>
        <input type="text" id="migrate-sheet" placeholder="例：七月份例會">
        <button class="btn" onclick="doMigrate()">開始匯入</button>
        <div class="msg" id="migrate-msg"></div>
      </div>
      <div class="box">
        <div class="box-title">會員名冊</div>
        <div style="margin-bottom:10px">
          <button class="btn btn-sm btn-outline" onclick="loadMembers()">重新整理</button>
          <button class="btn btn-sm btn-outline" onclick="exportMembersCSV()">匯出 CSV</button>
        </div>
        <div class="tbl">
          <table id="members-table">
            <tr><th>姓名</th><th>電話</th><th>出生年月日</th><th>身份</th><th>加入日期</th></tr>
          </table>
        </div>
      </div>
    </div>

    <!-- 出席統計 -->
    <div id="tab-stats" style="display:none">
      <div class="box">
        <div class="box-title">會員出席率統計</div>
        <div style="margin-bottom:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <button class="btn btn-sm btn-outline" onclick="loadAttendanceStats()">重新整理</button>
          <button class="btn btn-sm btn-outline" onclick="exportStatsCSV()">匯出 CSV</button>
          <input type="text" id="stats-search" placeholder="搜尋姓名…" oninput="filterStats()" style="width:120px;padding:7px 10px;font-size:14px;border:1.5px solid #c8aa80;border-radius:8px;margin-top:0">
        </div>
        <div id="stats-summary" style="font-size:13px;color:#8a7a63;margin-bottom:8px"></div>
        <div class="tbl">
          <table id="stats-table">
            <tr><th>#</th><th>姓名</th><th>電話</th><th>總活動</th><th>出席</th><th>請假</th><th>實際報到</th><th>報到率</th></tr>
          </table>
        </div>
      </div>
    </div>

    <!-- 批次列印 -->
    <div id="tab-print" style="display:none">
      <div class="box">
        <div class="box-title">批次列印 QR Code 名牌</div>
        <div style="margin-bottom:10px">
          <button class="btn btn-sm btn-outline" onclick="loadBatchPrint()">重新載入</button>
          <button class="btn btn-sm" onclick="window.print()">🖨️ 列印（A4）</button>
        </div>
        <div id="batch-count" style="font-size:14px;color:#8a7a63;margin-bottom:8px"></div>
        <div class="from-row">
          <span>從第</span>
          <input type="number" id="from-num" value="1" min="1">
          <span>號開始</span>
          <button onclick="applyFrom()">套用</button>
        </div>
        <div class="badge-grid" id="badge-grid"></div>
      </div>
    </div>

    <!-- 活動管理 -->
    <div id="tab-setup" style="display:none">
      <div class="box">
        <div class="box-title">建立 / 切換活動</div>
        <label>活動名稱 *</label>
        <input type="text" id="ev-name" placeholder="例：八月份例會">
        <label>活動日期</label>
        <input type="text" id="ev-date" placeholder="例：2026/08/24">
        <label>活動時間</label>
        <input type="text" id="ev-time" placeholder="例：14:00–16:00">
        <label>地點</label>
        <input type="text" id="ev-loc" placeholder="例：愛心家園">
        <label>主題</label>
        <input type="text" id="ev-topic">
        <label>主講者</label>
        <input type="text" id="ev-speaker">
        <label>內容簡介</label>
        <textarea id="ev-desc" style="min-height:60px"></textarea>
        <label>來賓費用</label>
        <input type="text" id="ev-fee" placeholder="例：500元(含便當)">
        <label>海報圖片連結（選填）</label>
        <input type="url" id="ev-poster" placeholder="https://... 圖片網址">
        <button class="btn" onclick="doSaveEvent()">建立 / 更新活動</button>
        <div class="msg" id="setup-msg"></div>
      </div>
    </div>
  </div>
</div>

<script>
var API='https://script.google.com/macros/s/AKfycbx8wYkMnToVxSSwK0YxC-Ki99-h-W3_VVKhHwbpUgpLVcIyjD_RJ-SYAW85hd1e_8-J0g/exec';
var PASS='';
var _guests=[],_members=[],_statsData=[];
var _currentSheet='';

function apiFetch(url){
  return fetch(url,{redirect:'follow'}).then(function(r){return r.json();});
}

function showMsg(id,txt,ok){
  var el=document.getElementById(id);
  el.textContent=txt;
  el.className='msg show '+(ok?'ok-msg':'err-msg');
}

function doLogin(){
  var p=document.getElementById('pass-input').value;
  if(!p){showMsg('login-msg','請輸入密碼',false);return;}
  apiFetch(API+'?action=admin_login&pass='+encodeURIComponent(p))
    .then(function(d){
      if(!d.ok){showMsg('login-msg','密碼錯誤',false);return;}
      PASS=p;
      document.getElementById('login').style.display='none';
      document.getElementById('main').style.display='block';
      loadEventList();
      loadEventInfo();
    }).catch(function(){showMsg('login-msg','連線失敗',false);});
}

function loadEventInfo(){
  apiFetch(API+'?action=info').then(function(d){
    if(d.ok&&d.config&&d.config.eventName){
      document.getElementById('event-title').textContent=d.config.eventName+' 名單';
      var c=d.config;
      document.getElementById('ev-name').value=c.eventName||'';
      document.getElementById('ev-date').value=c.eventDate||'';
      document.getElementById('ev-time').value=c.eventTime||'';
      document.getElementById('ev-loc').value=c.location||'';
      document.getElementById('ev-topic').value=c.topic||'';
      document.getElementById('ev-speaker').value=c.speaker||'';
      document.getElementById('ev-desc').value=c.desc||'';
      document.getElementById('ev-fee').value=c.guestFee||'';
      document.getElementById('ev-poster').value=c.posterUrl||'';
    }
  }).catch(function(){});
}

function switchTab(name){
  ['event','members','stats','setup','print'].forEach(function(t){
    document.getElementById('tab-'+t).style.display=(t===name?'block':'none');
  });
  document.querySelectorAll('.tab').forEach(function(el,i){
    el.classList.toggle('active',['event','members','stats','setup','print'][i]===name);
  });
  if(name==='members'&&!_members.length)loadMembers();
  if(name==='stats'&&!_statsData.length)loadAttendanceStats();
  if(name==='print'&&!document.getElementById('badge-grid').children.length)loadBatchPrint();
}

function loadBatchPrint(){
  document.getElementById('batch-count').textContent='載入中…';
  apiFetch(API+'?action=admin_members&pass='+encodeURIComponent(PASS))
    .then(function(d){
      if(!d.ok){document.getElementById('batch-count').textContent='載入失敗';return;}
      var members=d.members||[];
      var grid=document.getElementById('badge-grid');
      grid.innerHTML='';
      members.forEach(function(m){
        if(!m.phone)return;
        var phone=String(m.phone).trim();
        if(!phone)return;
        var num=grid.children.length+1;
        var div=document.createElement('div');
        div.className='badge-card';
        div.dataset.num=num;
        var qid='bqr-'+phone.replace(/\D/g,'');
        div.innerHTML='<div class="badge-num">'+num+'</div>'
          +'<div class="badge-name">'+escH(m.name||'')+'</div>'
          +'<div class="badge-qr" id="'+qid+'"></div>'
          +'<div class="badge-phone">'+escH(phone)+'</div>'
          +'<div class="badge-org">臺中市海德堡讀書會</div>';
        grid.appendChild(div);
        new QRCode(document.getElementById(qid),{
          text:'https://check-in-system.netlify.app/checkin.html?p='+encodeURIComponent(phone),
          width:150,height:150,colorDark:'#3a2e1e',colorLight:'#fff',
          correctLevel:QRCode.CorrectLevel.M
        });
      });
      document.getElementById('batch-count').textContent='共 '+members.length+' 位會員';
      document.getElementById('from-num').max=members.length;
    })
    .catch(function(){document.getElementById('batch-count').textContent='網路錯誤，請重試';});
}

function applyFrom(){
  var from=parseInt(document.getElementById('from-num').value)||1;
  document.querySelectorAll('.badge-card').forEach(function(c){
    c.style.display=parseInt(c.dataset.num)>=from?'':'none';
  });
}

function escH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function fixOldFormatGuests(guests){
  // Fallback for old server code that returned timestamp as 'name'.
  // Detect: name is ISO timestamp OR JS Date.toString() format ("Thu Jul 16 2026...")
  if(!guests.length) return guests;
  var n=String(guests[0].name);
  var isStamp=/^\d{4}-\d{2}-\d{2}T/.test(n)||/^(Mon|Tue|Wed|Thu|Fri|Sat|Sun)\s/.test(n);
  if(!isStamp) return guests;
  return guests.map(function(g){
    var realTime=/^\d{2}:\d{2}/.test(String(g.checkinTime))?String(g.checkinTime):'';
    return{name:String(g.phone||''),phone:String(g.attendance||''),
      attendance:'出席',meal:'',lunchbox:'0',note:String(g.note||''),
      checkinTime:realTime,checkedIn:!!realTime};
  });
}

function loadEventList(){
  apiFetch(API+'?action=admin_list_events&pass='+encodeURIComponent(PASS))
    .then(function(d){
      if(!d.ok)return;
      var sel=document.getElementById('event-select');
      sel.innerHTML='';
      (d.events||[]).forEach(function(name){
        var opt=document.createElement('option');
        opt.value=name;opt.textContent=name;
        if(name===d.current)opt.selected=true;
        sel.appendChild(opt);
      });
      _currentSheet=d.current||'';
      loadGuests();
    }).catch(function(){loadGuests();});
}

function switchEvent(sheetName){
  _currentSheet=sheetName;
  document.getElementById('event-title').textContent=sheetName+' 名單';
  loadGuests();
}

function loadGuests(){
  document.getElementById('event-table').innerHTML='<tr><th>#</th><th>姓名</th><th>電話</th><th>出席</th><th>用餐</th><th>加購</th><th>備註</th><th>報到</th></tr><tr><td colspan="8" style="text-align:center;padding:20px;color:#8a7a63">載入中…</td></tr>';
  var url=_currentSheet
    ? API+'?action=admin_event_guests_by&pass='+encodeURIComponent(PASS)+'&sheetName='+encodeURIComponent(_currentSheet)
    : API+'?action=admin_event_guests&pass='+encodeURIComponent(PASS);
  apiFetch(url)
    .then(function(d){
      if(!d.ok){alert(d.msg||'載入失敗');return;}
      _guests=fixOldFormatGuests(d.guests||[]);
      renderGuests(_guests);
      document.getElementById('st-total').textContent=_guests.length;
      document.getElementById('st-attend').textContent=_guests.filter(function(g){return g.attendance==='出席';}).length;
      document.getElementById('st-absent').textContent=_guests.filter(function(g){return g.attendance==='請假';}).length;
      var mealCount=_guests.filter(function(g){return g.meal==='用餐';}).length;
      var lunchTotal=_guests.reduce(function(s,g){return s+parseInt(g.lunchbox||0);},0);
      document.getElementById('st-meal').textContent=(mealCount+lunchTotal)+'份';
      document.getElementById('st-checked').textContent=_guests.filter(function(g){return g.checkedIn;}).length;
      loadBirthdays();
    }).catch(function(){alert('連線失敗');});
}

function loadBirthdays(){
  apiFetch(API+'?action=admin_members&pass='+encodeURIComponent(PASS))
    .then(function(d){
      if(!d.ok)return;
      var thisMonth=new Date().getMonth()+1;
      var bdays=(d.members||[]).filter(function(m){
        var match=String(m.birthday||'').match(/(\d+)月/);
        return match&&parseInt(match[1])===thisMonth;
      });
      var box=document.getElementById('birthday-box');
      if(!bdays.length){box.style.display='none';return;}
      box.style.display='block';
      document.getElementById('birthday-list').innerHTML=bdays.map(function(m){
        return '🎂 <strong>'+escH(m.name)+'</strong>';
      }).join('　　');
    }).catch(function(){});
}

function renderGuests(guests){
  var isCurrentEvent=!_currentSheet||_currentSheet===(document.getElementById('event-select').value);
  var rows=guests.map(function(g,i){
    var ci;
    if(g.checkedIn){
      ci='<span class="ok">✓ '+escH(g.checkinTime)+'</span>';
    } else if(g.attendance==='出席'&&isCurrentEvent){
      ci='<button class="btn btn-sm" style="padding:4px 10px;font-size:12px;margin:0;background:#4a7c59" onclick="manualCheckin(\''+escH(g.phone)+'\',this)">手動報到</button>';
    } else {
      ci='<span class="no">未到</span>';
    }
    return '<tr><td>'+(i+1)+'</td><td>'+esc(g.name)+'</td><td style="font-size:12px;color:#8a7a63">'+esc(g.phone)+'</td><td>'+(g.attendance||'')+'</td><td>'+(g.meal||'')+'</td><td>'+(g.lunchbox||'0')+'</td><td>'+esc(g.note||'')+'</td><td>'+ci+'</td></tr>';
  }).join('');
  document.getElementById('event-table').innerHTML='<tr><th>#</th><th>姓名</th><th>電話</th><th>出席</th><th>用餐</th><th>加購</th><th>備註</th><th>報到</th></tr>'+(rows||'<tr><td colspan="8" style="text-align:center;padding:20px;color:#8a7a63">尚無資料</td></tr>');
}

function manualCheckin(phone,btn){
  if(!confirm('確定為此人手動報到？'))return;
  btn.disabled=true;btn.textContent='報到中…';
  var url=API+'?action=admin_manual_checkin&pass='+encodeURIComponent(PASS)+'&phone='+encodeURIComponent(phone);
  if(_currentSheet)url+='&sheetName='+encodeURIComponent(_currentSheet);
  apiFetch(url).then(function(d){
    if(d.ok){
      var td=btn.parentNode;
      td.innerHTML='<span class="ok">✓ '+escH(d.time)+'</span>';
      var n=parseInt(document.getElementById('st-checked').textContent)||0;
      document.getElementById('st-checked').textContent=n+1;
    } else {
      alert(d.msg||'報到失敗');
      btn.disabled=false;btn.textContent='手動報到';
    }
  }).catch(function(){alert('連線失敗');btn.disabled=false;btn.textContent='手動報到';});
}

function exportGuestsCSV(){
  if(!_guests.length){alert('尚無資料');return;}
  var fname=(_currentSheet||'活動名單')+'.csv';
  var rows=[['編號','姓名','電話','出席狀況','用餐','加購便當','備註','報到狀態','報到時間']];
  _guests.forEach(function(g,i){rows.push([i+1,g.name,'="'+g.phone+'"',g.attendance||'',g.meal||'',g.lunchbox||'0',g.note||'',g.checkedIn?'已報到':'未到',g.checkinTime||'']);});
  dlCSV(rows,fname);
}

function loadMembers(){
  document.getElementById('members-table').innerHTML='<tr><th>姓名</th><th>電話</th><th>出生年月日</th><th>身份</th><th>加入日期</th></tr><tr><td colspan="5" style="text-align:center;padding:20px;color:#8a7a63">載入中…</td></tr>';
  apiFetch(API+'?action=admin_members&pass='+encodeURIComponent(PASS))
    .then(function(d){
      if(!d.ok){alert(d.msg||'載入失敗');return;}
      _members=d.members||[];
      var rows=_members.map(function(m){
        var jd=m.joinDate?String(m.joinDate).replace(/T.*/,'').replace(/-/g,'/'):'';
        return '<tr><td>'+esc(m.name)+'</td><td>'+esc(m.phone)+'</td><td>'+(m.birthday||'')+'</td><td>'+(m.memberType||'')+'</td><td>'+jd+'</td></tr>';
      }).join('');
      document.getElementById('members-table').innerHTML='<tr><th>姓名</th><th>電話</th><th>出生年月日</th><th>身份</th><th>加入日期</th></tr>'+(rows||'<tr><td colspan="5" style="text-align:center;padding:20px;color:#8a7a63">尚無資料</td></tr>');
    }).catch(function(){alert('連線失敗');});
}

function exportMembersCSV(){
  if(!_members.length){alert('尚無資料');return;}
  var rows=[['姓名','電話','出生年月日','身份','加入日期']];
  _members.forEach(function(m){rows.push([m.name,'="'+m.phone+'"',m.birthday||'',m.memberType||'',m.joinDate||'']);});
  dlCSV(rows,'會員名冊.csv');
}

function doMigrate(){
  var sheet=document.getElementById('migrate-sheet').value.trim();
  if(!sheet){showMsg('migrate-msg','請填寫活動分頁名稱',false);return;}
  showMsg('migrate-msg','匯入中，請稍候…',true);
  apiFetch(API+'?action=admin_migrate&pass='+encodeURIComponent(PASS)+'&sheetName='+encodeURIComponent(sheet))
    .then(function(d){
      if(d.ok){showMsg('migrate-msg','匯入完成！新增 '+d.added+' 位，跳過 '+d.skipped+' 位（已存在）',true);loadMembers();}
      else showMsg('migrate-msg',d.msg||'匯入失敗',false);
    }).catch(function(){showMsg('migrate-msg','連線失敗',false);});
}

function doSaveEvent(){
  var name=document.getElementById('ev-name').value.trim();
  if(!name){showMsg('setup-msg','請填寫活動名稱',false);return;}
  var p=new URLSearchParams({action:'admin_create_event',pass:PASS,eventName:name,
    eventDate:document.getElementById('ev-date').value.trim(),
    eventTime:document.getElementById('ev-time').value.trim(),
    location:document.getElementById('ev-loc').value.trim(),
    topic:document.getElementById('ev-topic').value.trim(),
    speaker:document.getElementById('ev-speaker').value.trim(),
    desc:document.getElementById('ev-desc').value.trim(),
    guestFee:document.getElementById('ev-fee').value.trim(),
    posterUrl:document.getElementById('ev-poster').value.trim()});
  apiFetch(API+'?'+p)
    .then(function(d){
      if(d.ok){showMsg('setup-msg',d.msg||'活動已建立',true);loadEventInfo();}
      else showMsg('setup-msg',d.msg||'失敗',false);
    }).catch(function(){showMsg('setup-msg','連線失敗',false);});
}

function loadAttendanceStats(){
  var tbl=document.getElementById('stats-table');
  tbl.innerHTML='<tr><th>#</th><th>姓名</th><th>電話</th><th>總活動</th><th>出席</th><th>請假</th><th>實際報到</th><th>報到率</th></tr><tr><td colspan="8" style="text-align:center;padding:20px;color:#8a7a63">統計中，請稍候…</td></tr>';
  document.getElementById('stats-summary').textContent='';
  apiFetch(API+'?action=admin_attendance&pass='+encodeURIComponent(PASS))
    .then(function(d){
      if(!d.ok){alert(d.msg||'載入失敗');return;}
      _statsData=d.stats||[];
      document.getElementById('stats-summary').textContent='共 '+_statsData.length+' 位會員・涵蓋 '+d.eventCount+' 場活動';
      renderStats(_statsData);
    }).catch(function(){alert('連線失敗');});
}

function renderStats(data){
  var rows=data.map(function(s,i){
    var bar=Math.round(s.rate/10);
    var color=s.rate>=80?'#4a7c59':s.rate>=50?'#a8874f':'#b5544b';
    var blocks='█'.repeat(bar)+'░'.repeat(10-bar);
    return '<tr>'
      +'<td>'+(i+1)+'</td>'
      +'<td>'+escH(s.name)+'</td>'
      +'<td style="font-size:12px;color:#8a7a63">'+escH(s.phone)+'</td>'
      +'<td style="text-align:center">'+s.total+'</td>'
      +'<td style="text-align:center;color:#4a7c59;font-weight:700">'+s.attend+'</td>'
      +'<td style="text-align:center;color:#8a7a63">'+s.absent+'</td>'
      +'<td style="text-align:center;color:#4a7c59;font-weight:700">'+s.checkedIn+'</td>'
      +'<td style="white-space:nowrap"><span style="color:'+color+';font-weight:700">'+s.rate+'%</span> <span style="font-size:11px;color:#ccc;letter-spacing:-1px">'+blocks+'</span></td>'
      +'</tr>';
  }).join('');
  document.getElementById('stats-table').innerHTML='<tr><th>#</th><th>姓名</th><th>電話</th><th>總活動</th><th>出席</th><th>請假</th><th>實際報到</th><th>報到率</th></tr>'+(rows||'<tr><td colspan="8" style="text-align:center;padding:20px;color:#8a7a63">尚無資料</td></tr>');
}

function filterStats(){
  var q=document.getElementById('stats-search').value.trim();
  if(!q){renderStats(_statsData);return;}
  var filtered=_statsData.filter(function(s){return s.name.indexOf(q)>=0||String(s.phone).indexOf(q)>=0;});
  renderStats(filtered);
}

function exportStatsCSV(){
  if(!_statsData.length){alert('尚無資料');return;}
  var rows=[['姓名','電話','總活動場次','登記出席','請假','實際報到','報到率(%)']];
  _statsData.forEach(function(s){rows.push([s.name,'="'+s.phone+'"',s.total,s.attend,s.absent,s.checkedIn,s.rate]);});
  dlCSV(rows,'會員出席統計.csv');
}

function dlCSV(rows,filename){
  var csv='﻿'+rows.map(function(r){return r.map(function(c){return '"'+String(c||'').replace(/"/g,'""')+'"';}).join(',');}).join('\r\n');
  var a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download=filename;a.click();
}
function esc(s){return String(s||'').replace(/[<>&"]/g,function(c){return{'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c];});}
</script>
