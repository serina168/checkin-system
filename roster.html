<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>報名名單 — 海德堡讀書會</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#a8874f;--gold-lt:#c9a86a;--gold-dk:#8a6c38;--cream:#faf6ef;--ink:#3d3226;--muted:#8a7a63;--ok:#4a7c59;--border:rgba(200,170,110,.32)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans TC',sans-serif;background:var(--cream);color:var(--ink);font-size:16px;line-height:1.6;min-height:100vh;padding:0 0 50px}
.wrap{max-width:540px;margin:0 auto;padding:0 14px}
.page-header{text-align:center;padding:22px 0 16px}
.brand{font-size:11px;letter-spacing:.5em;color:var(--gold);text-indent:.5em;margin-bottom:3px;font-weight:500}
.page-title{font-family:'Noto Serif TC',serif;font-size:20px;font-weight:700;color:var(--ink)}
.event-name{font-size:14px;color:var(--muted);margin-top:4px}
.stat-box{background:linear-gradient(135deg,var(--gold-lt),var(--gold));color:#fff;border-radius:16px;padding:18px 16px;text-align:center;margin-bottom:16px;box-shadow:0 4px 18px rgba(168,135,79,.28)}
.stat-num{font-family:'Noto Serif TC',serif;font-size:48px;font-weight:700;line-height:1}
.stat-label{font-size:14px;margin-top:4px;opacity:.9;letter-spacing:.04em}
.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 4px 18px rgba(140,110,60,.08);margin-bottom:14px}
.section-title{font-family:'Noto Serif TC',serif;font-size:15px;font-weight:700;color:var(--gold-dk);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}

/* 三欄緊湊格 */
.member-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.member-chip{background:var(--cream);border:1px solid var(--border);border-radius:9px;padding:8px 6px;font-size:14px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:5px;min-width:0}
.member-chip .num{font-size:11px;color:var(--muted);font-weight:400;flex-shrink:0;min-width:16px}
.member-chip .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 召喚文字區塊 */
.invite-box{background:#fff;border:1.5px solid var(--border);border-radius:16px;padding:20px 18px;margin-bottom:14px;text-align:center}
.invite-icon{font-size:32px;margin-bottom:8px}
.invite-title{font-family:'Noto Serif TC',serif;font-size:17px;font-weight:700;color:var(--gold-dk);margin-bottom:8px}
.invite-text{font-size:14px;color:var(--muted);line-height:1.9}
.invite-text strong{color:var(--ink)}

.share-btn{display:block;width:100%;font-family:inherit;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--gold-lt),var(--gold));border:none;border-radius:14px;padding:15px;cursor:pointer;box-shadow:0 4px 14px rgba(168,135,79,.3);margin-bottom:14px;letter-spacing:.04em}
.share-btn:active{opacity:.85}
.back-link{display:block;text-align:center;color:var(--muted);font-size:14px;padding:8px;text-decoration:none}
.back-link:hover{color:var(--gold)}
.loading{text-align:center;color:var(--muted);padding:40px 0;font-size:15px}
.refresh-note{text-align:center;font-size:12px;color:var(--muted);margin-top:10px}
</style>
</head>
<body>
<div id="line-banner" style="display:none;background:#06C755;color:#fff;padding:14px 16px;text-align:center;font-size:15px;font-weight:700;position:sticky;top:0;z-index:100;line-height:1.5">
  ⚠️ 請點右上角 <strong>···</strong> 選「<strong>用瀏覽器開啟</strong>」<br>以查看完整名單
</div>
<div class="wrap">
  <div class="page-header">
    <div class="brand">臺中市海德堡讀書會</div>
    <div class="page-title">已報名名單</div>
    <div class="event-name" id="event-name">載入中…</div>
  </div>

  <div id="loading" class="loading">載入中，請稍候…</div>

  <div id="content" style="display:none">
    <div class="stat-box">
      <div class="stat-num" id="stat-num">0</div>
      <div class="stat-label">位姊妹已報名出席 🎉</div>
    </div>

    <div class="card">
      <div class="section-title">報名出席名單</div>
      <div class="member-grid" id="member-grid"></div>
    </div>

    <!-- 召喚文字 -->
    <div class="invite-box">
      <div class="invite-icon">🌸</div>
      <div class="invite-title">還在等什麼？快來加入我們！</div>
      <div class="invite-text">
        每一位姊妹的出現，都讓這個圓圈更溫暖。<br>
        <strong>把這個名單分享給還沒報名的姊妹</strong>，<br>
        一起來聆聽、共學、相聚。<br><br>
        ✨ 期待在活動現場見到妳的笑容 ✨
      </div>
    </div>

    <button class="share-btn" onclick="shareRoster()">📣 分享名單，召喚更多姊妹！</button>
    <a class="back-link" href="register.html">← 前往報名</a>
    <div class="refresh-note" id="refresh-note"></div>
  </div>
</div>

<script>
(function(){
  if(/Line\//i.test(navigator.userAgent)){
    if(!/openExternalBrowser=1/.test(location.search)){
      var sep=location.search?'&':'?';
      location.href=location.href.split('?')[0]+location.search+sep+'openExternalBrowser=1';
    } else {
      document.getElementById('line-banner').style.display='block';
    }
  }
})();

var API='https://script.google.com/macros/s/AKfycbxYsFDij-NEhv_v6q19b6qF92Ew3tWji2lSYUcYCijgMaifSb9B03fjNRtg6RUnine4hA/exec';

function apiFetch(url){
  return new Promise(function(resolve,reject){
    var xhr=new XMLHttpRequest();
    xhr.open('GET',url,true);
    xhr.timeout=12000;
    xhr.onload=function(){
      try{resolve(JSON.parse(xhr.responseText));}catch(e){reject(e);}
    };
    xhr.onerror=function(){reject(new Error('network'));};
    xhr.ontimeout=function(){reject(new Error('timeout'));};
    xhr.send();
  });
}

function formatDate(s){
  if(!s)return'';
  if(String(s).match(/^\d{4}-\d{2}-\d{2}T/)){
    var d=new Date(s);
    return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日';
  }
  var m=String(s).match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if(m)return m[1]+'年'+parseInt(m[2])+'月'+parseInt(m[3])+'日';
  return s;
}

apiFetch(API+'?action=public_roster').then(function(d){
  document.getElementById('loading').style.display='none';
  if(!d.ok){document.getElementById('loading').textContent='載入失敗，請稍後重試。';document.getElementById('loading').style.display='';return;}
  var evLabel=d.eventName+(d.eventDate?' ・ '+formatDate(d.eventDate):'');
  document.getElementById('event-name').textContent=evLabel||'本次活動';
  document.title=(d.eventName||'報名名單')+' — 海德堡讀書會';
  document.getElementById('stat-num').textContent=d.attending.length;
  var grid=document.getElementById('member-grid');
  d.attending.forEach(function(m,i){
    var chip=document.createElement('div');
    chip.className='member-chip';
    chip.innerHTML='<span class="num">'+(i+1)+'</span><span class="name">'+escH(m.name)+'</span>';
    grid.appendChild(chip);
  });
  if(!d.attending.length){
    grid.innerHTML='<div style="grid-column:1/-1;text-align:center;color:var(--muted);padding:20px 0">還沒有人報名，快來第一個！</div>';
  }
  var now=new Date();
  document.getElementById('refresh-note').textContent='資料更新時間：'+now.getHours()+':'+String(now.getMinutes()).padStart(2,'0');
  document.getElementById('content').style.display='';
}).catch(function(){
  document.getElementById('loading').textContent='載入失敗，請稍後重試。';
});

function escH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function shareRoster(){
  var url=window.location.href.split('?')[0];
  if(navigator.share){
    navigator.share({title:'海德堡讀書會報名名單',text:'姊妹快來！這次已經這麼多人報名了 👉 '+url,url:url}).catch(function(){});
  } else if(navigator.clipboard){
    navigator.clipboard.writeText(url).then(function(){alert('連結已複製，快傳給姊妹！');}).catch(function(){prompt('請複製此連結：',url);});
  } else {
    prompt('請複製此連結：',url);
  }
}
</script>
</body>
</html>
