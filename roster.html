<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>報名名單 — 海德堡讀書會</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#a8874f;--gold-lt:#c9a86a;--gold-dk:#8a6c38;--cream:#faf6ef;--ink:#3d3226;--muted:#8a7a63;--ok:#4a7c59;--border:rgba(200,170,110,.32)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans TC',sans-serif;background:var(--cream);color:var(--ink);font-size:17px;line-height:1.7;min-height:100vh;padding:0 0 60px}
.wrap{max-width:540px;margin:0 auto;padding:0 16px}
.page-header{text-align:center;padding:28px 0 20px}
.brand{font-size:12px;letter-spacing:.5em;color:var(--gold);text-indent:.5em;margin-bottom:4px;font-weight:500}
.page-title{font-family:'Noto Serif TC',serif;font-size:22px;font-weight:700;color:var(--ink)}
.event-name{font-size:15px;color:var(--muted);margin-top:6px}
.stat-box{background:linear-gradient(135deg,var(--gold-lt),var(--gold));color:#fff;border-radius:18px;padding:22px 20px;text-align:center;margin-bottom:20px;box-shadow:0 6px 24px rgba(168,135,79,.3)}
.stat-num{font-family:'Noto Serif TC',serif;font-size:52px;font-weight:700;line-height:1}
.stat-label{font-size:15px;margin-top:6px;opacity:.9;letter-spacing:.04em}
.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:0 6px 24px rgba(140,110,60,.09);margin-bottom:16px}
.section-title{font-family:'Noto Serif TC',serif;font-size:17px;font-weight:700;color:var(--gold-dk);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}
.member-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.member-chip{background:var(--cream);border:1.5px solid var(--border);border-radius:12px;padding:11px 14px;font-size:16px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:8px}
.member-chip .num{font-size:13px;color:var(--muted);font-weight:400;min-width:20px}
.share-btn{display:block;width:100%;font-family:inherit;font-size:17px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--gold-lt),var(--gold));border:none;border-radius:14px;padding:16px;cursor:pointer;box-shadow:0 4px 14px rgba(168,135,79,.3);margin-bottom:16px;letter-spacing:.04em}
.share-btn:active{opacity:.85}
.back-link{display:block;text-align:center;color:var(--muted);font-size:15px;padding:8px;text-decoration:none}
.back-link:hover{color:var(--gold)}
.loading{text-align:center;color:var(--muted);padding:40px 0;font-size:16px}
.refresh-note{text-align:center;font-size:13px;color:var(--muted);margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="page-header">
    <div class="brand">臺中市海德堡讀書會</div>
    <div class="page-title">已報名名單</div>
    <div class="event-name" id="event-name">載入中…</div>
  </div>

  <div id="loading" class="loading">載入中，請稍候…</div>

  <div id="content" style="display:none">
    <div class="stat-box">
      <div class="stat-num" id="stat-num">0</div>
      <div class="stat-label">位姊妹已報名出席 🎉</div>
    </div>

    <div class="card">
      <div class="section-title">報名出席名單</div>
      <div class="member-grid" id="member-grid"></div>
    </div>

    <button class="share-btn" onclick="shareRoster()">📣 分享名單，召喚更多姊妹！</button>
    <a class="back-link" href="register.html">← 前往報名</a>
    <div class="refresh-note" id="refresh-note"></div>
  </div>
</div>

<script>
var API='https://script.google.com/macros/s/AKfycbxYsFDij-NEhv_v6q19b6qF92Ew3tWji2lSYUcYCijgMaifSb9B03fjNRtg6RUnine4hA/exec';

function apiFetch(url){
  return fetch(url,{redirect:'follow'}).then(function(r){return r.json();});
}

function formatDate(s){
  if(!s)return'';
  var m=String(s).match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if(m)return m[1]+'年'+parseInt(m[2])+'月'+parseInt(m[3])+'日';
  return s;
}

apiFetch(API+'?action=public_roster').then(function(d){
  document.getElementById('loading').style.display='none';
  if(!d.ok){document.getElementById('loading').textContent='載入失敗，請稍後重試。';document.getElementById('loading').style.display='';return;}
  var evLabel=d.eventName+(d.eventDate?' ・ '+formatDate(d.eventDate):'');
  document.getElementById('event-name').textContent=evLabel||'本次活動';
  document.title=(d.eventName||'報名名單')+' — 海德堡讀書會';
  document.getElementById('stat-num').textContent=d.attending.length;
  var grid=document.getElementById('member-grid');
  d.attending.forEach(function(m,i){
    var chip=document.createElement('div');
    chip.className='member-chip';
    chip.innerHTML='<span class="num">'+(i+1)+'</span><span>'+escH(m.name)+'</span>';
    grid.appendChild(chip);
  });
  if(!d.attending.length){
    grid.innerHTML='<div style="grid-column:1/-1;text-align:center;color:var(--muted);padding:20px">還沒有人報名，快來第一個！</div>';
  }
  var now=new Date();
  document.getElementById('refresh-note').textContent='資料更新時間：'+now.getHours()+':'+String(now.getMinutes()).padStart(2,'0');
  document.getElementById('content').style.display='';
}).catch(function(){
  document.getElementById('loading').textContent='載入失敗，請稍後重試。';
});

function escH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function shareRoster(){
  var url=window.location.href.split('?')[0];
  var text='海德堡讀書會活動報名名單 👉 '+url+'\n快來一起報名！';
  if(navigator.share){
    navigator.share({title:'海德堡讀書會報名名單',text:text,url:url}).catch(function(){});
  } else if(navigator.clipboard){
    navigator.clipboard.writeText(url).then(function(){alert('連結已複製，請分享給姊妹！');}).catch(function(){prompt('請複製此連結：',url);});
  } else {
    prompt('請複製此連結：',url);
  }
}
</script>
</body>
</html>
