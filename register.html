<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>活動報名 — 海德堡讀書會</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
:root{--gold:#a8874f;--gold-lt:#c9a86a;--gold-dk:#8a6c38;--cream:#faf6ef;--ink:#3d3226;--muted:#8a7a63;--ok:#4a7c59;--err:#b5544b;--border:rgba(200,170,110,.32)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans TC',sans-serif;background:var(--cream);color:var(--ink);font-size:17px;line-height:1.7;min-height:100vh;padding:20px 16px 60px}
.wrap{max-width:540px;margin:0 auto}
header{text-align:center;padding:16px 0 20px}
.brand{font-size:12px;letter-spacing:.5em;color:var(--gold);text-indent:.5em;margin-bottom:6px;font-weight:500}
h1{font-family:'Noto Serif TC',serif;font-size:24px;font-weight:700}
.event-info{background:rgba(168,135,79,.08);border:1px solid rgba(168,135,79,.25);border-radius:14px;padding:14px 16px;margin-bottom:18px;font-size:15px;color:var(--muted);text-align:center;line-height:1.9}
.event-info strong{color:var(--ink);font-size:16px;display:block;margin-bottom:2px}
.card{background:rgba(255,255,255,.68);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:18px;padding:24px 20px;box-shadow:0 8px 30px rgba(140,110,60,.10);margin-bottom:16px}
.card-title{font-family:'Noto Serif TC',serif;font-size:18px;font-weight:700;color:var(--gold);margin-bottom:18px;display:flex;align-items:center;gap:8px}
.card-title::before{content:'';width:14px;height:2px;background:var(--gold-lt);border-radius:2px;flex-shrink:0}
.form-group{margin-bottom:16px}
label{display:block;font-size:15px;font-weight:600;color:var(--gold-dk);margin-bottom:7px}
input,select,textarea{width:100%;font-family:inherit;font-size:17px;color:var(--ink);padding:12px 14px;border:1.5px solid rgba(180,150,100,.4);border-radius:12px;background:#fff;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(168,135,79,.14)}
input::placeholder{color:#c0b09a}
textarea{resize:vertical;min-height:78px}
.bday-row{display:flex;gap:8px}
.bday-row select{flex:1}
.toggle-row{display:flex;gap:10px}
.toggle-row input[type="radio"]{display:none}
.toggle-row label{flex:1;text-align:center;padding:12px 6px;border:1.5px solid rgba(180,150,100,.4);border-radius:12px;background:#fff;cursor:pointer;font-size:17px;font-weight:500;color:var(--muted);transition:all .2s;margin-bottom:0}
.toggle-row input[type="radio"]:checked+label{border-color:var(--gold);background:rgba(168,135,79,.12);color:var(--gold-dk);font-weight:700;box-shadow:0 0 0 3px rgba(168,135,79,.14)}
.lookup-row{display:flex;gap:10px}
.lookup-row input{flex:1}
.btn-lookup{padding:12px 20px;background:var(--gold);color:#fff;border:none;border-radius:12px;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0}
.btn-lookup:active{opacity:.8}
.btn{width:100%;font-family:inherit;font-size:18px;font-weight:700;letter-spacing:.06em;color:#fff;padding:15px;border:none;border-radius:12px;cursor:pointer;margin-top:8px;background:linear-gradient(135deg,var(--gold-lt),var(--gold));box-shadow:0 4px 14px rgba(168,135,79,.3);transition:opacity .2s,transform .15s}
.btn:hover:not(:disabled){opacity:.88;transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(0)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:none;color:var(--muted);box-shadow:none;border:1px solid var(--border)}
.member-welcome{background:rgba(74,124,89,.08);border:1px solid rgba(74,124,89,.3);border-radius:12px;padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px}
.member-avatar{width:44px;height:44px;background:linear-gradient(135deg,var(--gold-lt),var(--gold));border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;flex-shrink:0}
.mname{font-weight:700;font-size:17px}
.mid{font-size:13px;color:var(--muted);margin-top:2px}
.divider{text-align:center;color:var(--muted);font-size:14px;margin:4px 0 16px;position:relative}
.divider::before,.divider::after{content:'';position:absolute;top:50%;width:calc(50% - 50px);height:1px;background:var(--border)}
.divider::before{left:0}.divider::after{right:0}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:12px 22px;border-radius:12px;font-size:15px;font-weight:500;color:#fff;z-index:999;display:none;max-width:calc(100% - 40px);text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.2)}
#toast.ok{background:var(--ok)}#toast.err{background:var(--err)}
#success-section{display:none;text-align:center}
.success-icon{font-size:54px;margin-bottom:10px}
.success-title{font-family:'Noto Serif TC',serif;font-size:22px;font-weight:700;margin-bottom:4px}
.success-sub{color:var(--muted);font-size:15px;margin-bottom:20px}
.qr-wrap{background:#fff;border-radius:16px;padding:22px;display:inline-block;box-shadow:0 4px 20px rgba(140,110,60,.12);margin-bottom:14px}
#qrcode{margin:0 auto}
.qr-id{font-family:monospace;font-size:22px;font-weight:700;color:var(--gold);margin-top:12px;letter-spacing:.1em}
.qr-hint{background:rgba(168,135,79,.08);border:1px solid rgba(168,135,79,.25);border-radius:12px;padding:14px 16px;font-size:14px;color:var(--muted);line-height:1.7;margin-bottom:16px;text-align:left}
.qr-hint strong{color:var(--ink)}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">臺中市海德堡讀書會</div>
    <h1>活動報名</h1>
  </header>

  <div id="event-info-card" class="event-info hidden"></div>

  <!-- Success -->
  <div id="success-section" class="card">
    <div class="success-icon">🎉</div>
    <div class="success-title">報名成功！</div>
    <div class="success-sub" id="success-msg"></div>
    <div class="qr-wrap">
      <div id="qrcode"></div>
      <div class="qr-id" id="qr-id-text"></div>
    </div>
    <div class="qr-hint">
      <strong>📌 請截圖保存這張 QR Code</strong><br>
      這是您的<strong>永久會員 QR Code</strong>，下次活動直接出示掃描即可報到，無需重新填寫資料。
    </div>
    <button class="btn" onclick="location.reload()">繼續報名（其他人）</button>
  </div>

  <!-- Step 1: Phone lookup -->
  <div id="step1" class="card">
    <div class="card-title">查詢會員資料</div>
    <div class="form-group">
      <label>電話號碼</label>
      <div class="lookup-row">
        <input type="tel" id="lookup-phone" placeholder="請輸入手機號碼" inputmode="tel" onkeydown="if(event.key==='Enter')lookupMember()">
        <button class="btn-lookup" onclick="lookupMember()">查詢</button>
      </div>
    </div>
    <div class="divider">首次報名請填寫下方表單</div>
    <button class="btn btn-ghost" onclick="showNewForm()">首次使用 / 新會員</button>
  </div>

  <!-- Step 2a: Existing member -->
  <div id="step-existing" class="card hidden">
    <div class="member-welcome">
      <div class="member-avatar">👤</div>
      <div>
        <div class="mname" id="welcome-name"></div>
        <div class="mid" id="welcome-id"></div>
      </div>
    </div>
    <div class="card-title">本次活動選擇</div>
    <div class="form-group">
      <label>出席狀況 *</label>
      <div class="toggle-row">
        <input type="radio" name="ex-att" id="ex-att-yes" value="出席">
        <label for="ex-att-yes">出席</label>
        <input type="radio" name="ex-att" id="ex-att-no" value="請假">
        <label for="ex-att-no">請假</label>
      </div>
    </div>
    <div id="ex-meal-wrap" class="hidden">
      <div class="form-group">
        <label>用餐 *</label>
        <div class="toggle-row">
          <input type="radio" name="ex-meal" id="ex-meal-yes" value="用餐">
          <label for="ex-meal-yes">用餐</label>
          <input type="radio" name="ex-meal" id="ex-meal-no" value="不用餐">
          <label for="ex-meal-no">不用餐</label>
        </div>
      </div>
      <div class="form-group">
        <label>加購便當（0–5 個）</label>
        <select id="ex-lunchbox">
          <option value="0">不加購</option>
          <option value="1">1 個</option><option value="2">2 個</option>
          <option value="3">3 個</option><option value="4">4 個</option><option value="5">5 個</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>備註（選填）</label>
      <textarea id="ex-note" placeholder="如有特殊需求請填寫"></textarea>
    </div>
    <button class="btn" id="ex-btn" onclick="submitExisting()">確認報名</button>
    <button class="btn btn-ghost" onclick="goBack()">← 返回</button>
  </div>

  <!-- Step 2b: New member -->
  <div id="step-new" class="card hidden">
    <div class="card-title">新會員報名</div>
    <div class="form-group">
      <label>姓名 *</label>
      <input type="text" id="new-name" placeholder="請填寫真實姓名">
    </div>
    <div class="form-group">
      <label>電話 *</label>
      <input type="tel" id="new-phone" placeholder="手機號碼" inputmode="tel">
    </div>
    <div class="form-group">
      <label>出生年月日（選填，用於壽星統計 🎂）</label>
      <div class="bday-row">
        <select id="new-by"><option value="">年</option></select>
        <select id="new-bm"><option value="">月</option></select>
        <select id="new-bd"><option value="">日</option></select>
      </div>
    </div>
    <div class="form-group">
      <label>身份 *</label>
      <div class="toggle-row">
        <input type="radio" name="new-type" id="new-type-m" value="會員">
        <label for="new-type-m">會員</label>
        <input type="radio" name="new-type" id="new-type-g" value="來賓">
        <label for="new-type-g">來賓</label>
      </div>
    </div>
    <div class="form-group">
      <label>出席狀況 *</label>
      <div class="toggle-row">
        <input type="radio" name="new-att" id="new-att-yes" value="出席">
        <label for="new-att-yes">出席</label>
        <input type="radio" name="new-att" id="new-att-no" value="請假">
        <label for="new-att-no">請假</label>
      </div>
    </div>
    <div id="new-meal-wrap" class="hidden">
      <div class="form-group">
        <label>用餐 *</label>
        <div class="toggle-row">
          <input type="radio" name="new-meal" id="new-meal-yes" value="用餐">
          <label for="new-meal-yes">用餐</label>
          <input type="radio" name="new-meal" id="new-meal-no" value="不用餐">
          <label for="new-meal-no">不用餐</label>
        </div>
      </div>
      <div class="form-group">
        <label>加購便當（0–5 個）</label>
        <select id="new-lunchbox">
          <option value="0">不加購</option>
          <option value="1">1 個</option><option value="2">2 個</option>
          <option value="3">3 個</option><option value="4">4 個</option><option value="5">5 個</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>備註（選填）</label>
      <textarea id="new-note" placeholder="如有特殊需求請填寫"></textarea>
    </div>
    <button class="btn" id="new-btn" onclick="submitNew()">確認報名</button>
    <button class="btn btn-ghost" onclick="goBack()">← 返回</button>
  </div>
</div>

<div id="toast"></div>

<script>
var API='https://script.google.com/macros/s/AKfycbyo57_hMEvdUP5vNLMUKSiD6jgFjct95cNY_nskRHxVxr6-LhId7UKJ--iVs_50b_3sJQ/exec';
var curId='',curName='';

(function(){
  var by=document.getElementById('new-by'),bm=document.getElementById('new-bm'),bd=document.getElementById('new-bd');
  for(var y=80;y>=30;y--)by.add(new Option('民國'+y+'年',y));
  for(var m=1;m<=12;m++)bm.add(new Option(m+'月',m));
  for(var d=1;d<=31;d++)bd.add(new Option(d+'日',d));
})();

['ex','new'].forEach(function(p){
  document.querySelectorAll('input[name="'+p+'-att"]').forEach(function(r){
    r.addEventListener('change',function(){
      document.getElementById(p+'-meal-wrap').classList.toggle('hidden',this.value!=='出席');
    });
  });
});

var _tt;
function toast(msg,err){
  var t=document.getElementById('toast');
  t.textContent=msg;t.className=err?'err':'ok';t.style.display='block';
  clearTimeout(_tt);_tt=setTimeout(function(){t.style.display='none';},3000);
}

function apiFetch(url){
  var ctrl=new AbortController();
  setTimeout(function(){ctrl.abort();},12000);
  return fetch(url,{redirect:'follow',signal:ctrl.signal}).then(function(r){return r.json();});
}

apiFetch(API+'?action=info').then(function(d){
  if(!d.ok||!d.config)return;
  var c=d.config,parts=[];
  if(c.eventName)parts.push('<strong>'+c.eventName+'</strong>');
  if(c.eventDate)parts.push(c.eventDate);
  if(c.eventTime)parts.push(c.eventTime);
  if(c.location)parts.push('📍 '+c.location);
  if(c.topic)parts.push('📖 '+c.topic);
  if(parts.length){
    var el=document.getElementById('event-info-card');
    el.innerHTML=parts.join('&emsp;');
    el.classList.remove('hidden');
  }
}).catch(function(){});

function lookupMember(){
  var phone=document.getElementById('lookup-phone').value.trim();
  if(!phone){toast('請輸入電話號碼',true);return;}
  toast('查詢中…');
  apiFetch(API+'?action=member_lookup&phone='+encodeURIComponent(phone))
    .then(function(d){
      if(!d.ok){toast(d.msg||'查詢失敗',true);return;}
      if(!d.found){
        document.getElementById('new-phone').value=phone;
        showNewForm();
        toast('找不到此電話，請填寫完整資料');
        return;
      }
      curId=d.member.memberId;curName=d.member.name;
      document.getElementById('welcome-name').textContent=d.member.name;
      document.getElementById('welcome-id').textContent=d.member.memberId+(d.member.memberType?' ・ '+d.member.memberType:'');
      show('step-existing');
      if(d.alreadyRegistered)toast('您已完成報名，可修改用餐選擇');
    })
    .catch(function(){toast('網路錯誤，請重試',true);});
}

function showNewForm(){show('step-new');}
function goBack(){show('step1');curId='';curName='';}
function show(id){
  ['step1','step-existing','step-new'].forEach(function(s){
    document.getElementById(s).classList.toggle('hidden',s!==id);
  });
}

function submitExisting(){
  var att=document.querySelector('input[name="ex-att"]:checked');
  var meal=document.querySelector('input[name="ex-meal"]:checked');
  if(!att)return toast('請選擇出席或請假',true);
  if(att.value==='出席'&&!meal)return toast('請選擇用餐方式',true);
  var lunchbox=document.getElementById('ex-lunchbox').value||'0';
  var note=document.getElementById('ex-note').value.trim();
  var btn=document.getElementById('ex-btn');
  btn.disabled=true;btn.textContent='送出中…';
  var p=new URLSearchParams({action:'event_register',memberId:curId,attendance:att.value,meal:att.value==='出席'?(meal?meal.value:''):'',lunchbox:lunchbox,note:note});
  apiFetch(API+'?'+p).then(function(d){
    if(!d.ok)throw new Error(d.msg||'報名失敗');
    showSuccess(d.memberId,d.name);
  }).catch(function(e){toast(e.message||'報名失敗',true);})
  .finally(function(){btn.disabled=false;btn.textContent='確認報名';});
}

function submitNew(){
  var name=document.getElementById('new-name').value.trim();
  var phone=document.getElementById('new-phone').value.trim();
  var typeEl=document.querySelector('input[name="new-type"]:checked');
  var attEl=document.querySelector('input[name="new-att"]:checked');
  var mealEl=document.querySelector('input[name="new-meal"]:checked');
  var lunchbox=document.getElementById('new-lunchbox').value||'0';
  var note=document.getElementById('new-note').value.trim();
  var by=document.getElementById('new-by').value,bm=document.getElementById('new-bm').value,bd=document.getElementById('new-bd').value;
  var birthday=(by&&bm&&bd)?'民國'+by+'年'+bm+'月'+bd+'日':'';
  if(!name)return toast('請填寫姓名',true);
  if(!phone)return toast('請填寫電話',true);
  if(!typeEl)return toast('請選擇身份',true);
  if(!attEl)return toast('請選擇出席狀況',true);
  if(attEl.value==='出席'&&!mealEl)return toast('請選擇用餐方式',true);
  var btn=document.getElementById('new-btn');
  btn.disabled=true;btn.textContent='送出中…';
  var p=new URLSearchParams({action:'event_register',name:name,phone:phone,birthday:birthday,memberType:typeEl.value,attendance:attEl.value,meal:attEl.value==='出席'?(mealEl?mealEl.value:''):'',lunchbox:lunchbox,note:note});
  apiFetch(API+'?'+p).then(function(d){
    if(!d.ok)throw new Error(d.msg||'報名失敗');
    showSuccess(d.memberId,d.name);
  }).catch(function(e){toast(e.message||'報名失敗',true);})
  .finally(function(){btn.disabled=false;btn.textContent='確認報名';});
}

function showSuccess(memberId,name){
  ['step1','step-existing','step-new'].forEach(function(s){document.getElementById(s).classList.add('hidden');});
  document.getElementById('success-msg').textContent=(name||'')+'，報名完成！';
  document.getElementById('qr-id-text').textContent=memberId;
  var el=document.getElementById('qrcode');el.innerHTML='';
  new QRCode(el,{text:memberId,width:200,height:200,colorDark:'#3a2e1e',colorLight:'#fff'});
  document.getElementById('success-section').style.display='';
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
</body>
</html>
