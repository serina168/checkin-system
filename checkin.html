<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>現場報到 — 海德堡讀書會</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--gold:#a8874f;--gold-lt:#c9a86a;--cream:#faf6ef;--ink:#3d3226;--muted:#8a7a63;--ok:#4a7c59;--warn:#c08a3e;--err:#b5544b}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans TC',sans-serif;background:var(--cream);color:var(--ink);font-size:20px;line-height:1.7;padding:14px 14px 40px;min-height:100vh}
.wrap{max-width:520px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 14px;gap:12px}
.top-title{font-family:'Noto Serif TC',serif;font-size:18px;font-weight:700}
.stats{display:flex;gap:8px}
.stat{background:rgba(255,255,255,.7);border:1px solid rgba(200,170,110,.3);border-radius:10px;padding:7px 15px;text-align:center;min-width:70px}
.stat .n{font-family:'Noto Serif TC',serif;font-size:26px;font-weight:700;line-height:1.15}
.stat .l{font-size:12px;color:var(--muted)}
.stat.in .n{color:var(--ok)}
.stat.left .n{color:var(--gold)}
.sec-label{font-size:16px;font-weight:700;color:var(--gold);margin:6px 2px 10px;display:flex;align-items:center;gap:8px}
.sec-label::before{content:'';width:20px;height:2px;background:var(--gold-lt);border-radius:2px}
#reader{border-radius:18px;overflow:hidden;border:1px solid rgba(200,170,110,.35);background:#000;box-shadow:0 8px 30px rgba(140,110,60,.14);min-height:300px}
#reader video{width:100%!important;display:block}
.scanhint{text-align:center;color:var(--muted);font-size:15px;margin:10px 0 4px}
.or{display:flex;align-items:center;gap:14px;margin:24px 2px 18px;color:var(--muted);font-size:15px}
.or::before,.or::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(200,170,110,.5),transparent)}
input[type=search]{width:100%;font-family:inherit;font-size:20px;color:var(--ink);padding:16px 18px;border:1.5px solid rgba(180,150,100,.4);border-radius:14px;background:rgba(255,255,255,.85)}
input[type=search]:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(168,135,79,.16)}
.list{margin-top:14px}
.row{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.74);border:1px solid rgba(200,170,110,.28);border-radius:14px;padding:15px 16px;margin-bottom:10px}
.row .info{flex:1;min-width:0}
.row .nm{font-weight:700;font-size:20px}
.row .meta{font-size:14px;color:var(--muted);margin-top:2px}
.row button{flex-shrink:0;font-family:inherit;font-size:17px;font-weight:700;color:#fff;padding:12px 22px;border:none;border-radius:11px;cursor:pointer;background:linear-gradient(135deg,var(--gold-lt),var(--gold))}
.row button:active{transform:translateY(1px)}
.row.done{background:rgba(74,124,89,.08);border-color:rgba(74,124,89,.3)}
.row .tag{flex-shrink:0;font-size:15px;font-weight:700;color:var(--ok);text-align:right;line-height:1.4}
.empty{text-align:center;color:var(--muted);padding:26px 0;font-size:16px}
#pop{position:fixed;inset:0;background:rgba(40,32,22,.55);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:24px;z-index:99}
#pop.on{display:flex}
.pop-card{width:100%;max-width:400px;background:var(--cream);border-radius:22px;padding:36px 26px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .22s cubic-bezier(.2,1.2,.4,1)}
@keyframes pop{from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}
.pop-ico{width:80px;height:80px;margin:0 auto 18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:42px}
.ok .pop-ico{background:rgba(74,124,89,.14);color:var(--ok);border:2px solid var(--ok)}
.dup .pop-ico{background:rgba(192,138,62,.14);color:var(--warn);border:2px solid var(--warn)}
.no .pop-ico{background:rgba(181,84,75,.12);color:var(--err);border:2px solid var(--err)}
.pop-nm{font-family:'Noto Serif TC',serif;font-size:34px;font-weight:700;margin-bottom:10px}
.pop-badges{display:flex;justify-content:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.badge{display:inline-block;padding:5px 16px;border-radius:20px;font-size:16px;font-weight:700}
.badge-meal{background:rgba(74,124,89,.12);color:var(--ok);border:1px solid rgba(74,124,89,.35)}
.badge-lb{background:rgba(181,84,75,.12);color:#b04030;border:1px solid rgba(181,84,75,.35);font-size:18px}
.pop-msg{font-size:19px;line-height:1.7}
.ok .pop-msg{color:var(--ok);font-weight:700}
.dup .pop-msg{color:var(--warn)}
.no .pop-msg{color:var(--err)}
.pop-card button{width:100%;margin-top:28px;font-family:inherit;font-size:20px;font-weight:700;letter-spacing:.1em;color:#fff;padding:17px;border:none;border-radius:13px;cursor:pointer;background:linear-gradient(135deg,var(--gold-lt),var(--gold))}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="top-title" id="evtTitle">海德堡讀書會報到</div>
    <div class="stats">
      <div class="stat in"><div class="n" id="s-in">0</div><div class="l">已報到</div></div>
      <div class="stat left"><div class="n" id="s-left">0</div><div class="l">未到</div></div>
    </div>
  </div>
  <div class="sec-label">掃描 QR Code 報到</div>
  <div id="reader"></div>
  <p class="scanhint">出示手機上的會員 QR Code 對準鏡頭</p>
  <div class="or">沒帶 QR？用姓名搜尋</div>
  <input type="search" id="q" placeholder="輸入姓名或電話…" oninput="doSearch()" autocomplete="off">
  <div class="list" id="list"><div class="empty">輸入姓名或電話搜尋</div></div>
</div>
<div id="pop" onclick="closePop()">
  <div class="pop-card" id="popCard" onclick="event.stopPropagation()">
    <div class="pop-ico" id="popIco"></div>
    <div class="pop-nm" id="popNm"></div>
    <div class="pop-badges" id="popBadges"></div>
    <div class="pop-msg" id="popMsg"></div>
    <button onclick="closePop()">繼續報到</button>
  </div>
</div>
<script>
var API='https://script.google.com/macros/s/AKfycbx8wYkMnToVxSSwK0YxC-Ki99-h-W3_VVKhHwbpUgpLVcIyjD_RJ-SYAW85hd1e_8-J0g/exec';
var $=function(id){return document.getElementById(id)};
var busy=false,lastCode='',lastAt=0;

fetch(API+'?action=info').then(function(r){return r.json();}).then(function(d){
  if(d.ok&&d.config&&d.config.eventName)$('evtTitle').textContent=d.config.eventName+' 報到';
}).catch(function(){});

var scanner=null;
function startScan(){
  if(scanner)return;
  scanner=new Html5Qrcode('reader');
  var boxSize=Math.min(Math.floor(window.innerWidth*0.72),300);
  var cfg={fps:15,qrbox:{width:boxSize,height:boxSize}};
  // Try rear camera first; fall back to any camera if black/error
  scanner.start({facingMode:{ideal:'environment'}},cfg,onScan,function(){})
    .then(function(){
      // Detect black frame after 2s and retry with front camera
      setTimeout(function(){
        var v=$('reader').querySelector('video');
        if(v&&v.videoWidth===0){
          scanner.stop().then(function(){
            scanner.start({facingMode:'user'},cfg,onScan,function(){}).catch(showCamError);
          }).catch(function(){});
        }
      },2000);
    })
    .catch(function(){
      // Rear camera failed entirely — try any available camera
      scanner.start({facingMode:'user'},cfg,onScan,function(){})
        .catch(showCamError);
    });
}
function showCamError(){
  $('reader').innerHTML='<div style="padding:44px 20px;text-align:center;color:#fff;font-size:16px">無法開啟相機<br><span style="font-size:14px;opacity:.75">請允許相機權限，或用下方搜尋姓名</span></div>';
}

function onScan(text){
  var now=Date.now();
  if(busy)return;
  if(text===lastCode&&now-lastAt<3000)return;
  lastCode=text;lastAt=now;
  doCheckIn(text.trim());
}

function doCheckIn(id){
  busy=true;
  fetch(API+'?action=event_checkin&phone='+encodeURIComponent(id))
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.ok){
        buzz([40,60,40]);
        var badges='';
        if(d.meal&&d.meal!=='不用餐')badges+='<span class="badge badge-meal">🍽 '+d.meal+'</span>';
        if(d.lunchbox&&d.lunchbox!='0')badges+='<span class="badge badge-lb">🍱 加購便當 '+d.lunchbox+' 個</span>';
        showPop('ok','✓',d.name,'報到完成！',badges);
        setTimeout(closePop,3000);
      }else{
        buzz([200]);
        showPop('no','✕',d.msg||'查無此人','請改用下方搜尋姓名','');
      }
      refreshStats();
    })
    .catch(function(){showPop('no','✕','連線失敗','請檢查網路','');})
    .finally(function(){busy=false;});
}

var searchTimer=null;
function doSearch(){
  clearTimeout(searchTimer);
  searchTimer=setTimeout(runSearch,300);
}

function runSearch(){
  var q=$('q').value.trim();
  if(!q){$('list').innerHTML='<div class="empty">輸入姓名或電話搜尋</div>';return;}
  fetch(API+'?action=event_search&q='+encodeURIComponent(q))
    .then(function(r){return r.json();})
    .then(function(d){renderList(d.results||[]);})
    .catch(function(){$('list').innerHTML='<div class="empty">連線失敗</div>';});
}

function renderList(rows){
  if(!rows.length){$('list').innerHTML='<div class="empty">查無此人</div>';return;}
  $('list').innerHTML=rows.map(function(r){
    var meta=(r.meal?r.meal:'')+(r.lunchbox&&r.lunchbox!='0'?' ・ 加購便當'+r.lunchbox+'個':'');
    if(r.checkedIn){
      return '<div class="row done"><div class="info"><div class="nm">'+esc(r.name)+'</div><div class="meta">'+mask(r.phone)+(meta?' ・ '+meta:'')+'</div></div><div class="tag">✓ 已報到</div></div>';
    }
    return '<div class="row"><div class="info"><div class="nm">'+esc(r.name)+'</div><div class="meta">'+mask(r.phone)+(meta?' ・ '+meta:'')+'</div></div><button onclick="manualCheckin(\''+r.phone+'\')">報到</button></div>';
  }).join('');
}

function manualCheckin(id){doCheckIn(id);setTimeout(runSearch,800);}

function refreshStats(){
  fetch(API+'?action=event_stats')
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.ok){$('s-in').textContent=d.checked;$('s-left').textContent=d.unchecked;}
    }).catch(function(){});
}

function showPop(cls,ico,nm,msg,badges){
  $('popCard').className='pop-card '+cls;
  $('popIco').textContent=ico;
  $('popNm').textContent=nm;
  $('popMsg').textContent=msg;
  $('popBadges').innerHTML=badges||'';
  $('pop').classList.add('on');
}
function closePop(){$('pop').classList.remove('on');}
function buzz(p){if(navigator.vibrate)navigator.vibrate(p);}
function esc(s){return String(s).replace(/[<>&"]/g,function(c){return{'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]);}
function mask(p){p=String(p);return p.length>6?p.slice(0,4)+'***'+p.slice(-3):p;}
startScan();refreshStats();setInterval(refreshStats,20000);
</script>
</body>
</html>
