<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>現場報到 — 海德堡讀書會</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#a8874f;--gold-lt:#c9a86a;--cream:#faf6ef;--ink:#3d3226;--muted:#8a7a63;--ok:#4a7c59;--warn:#c08a3e;--err:#b5544b}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans TC',sans-serif;background:var(--cream);color:var(--ink);font-size:20px;line-height:1.7;padding:14px 14px 40px;min-height:100vh}
.wrap{max-width:520px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 14px;gap:12px}
.top-title{font-family:'Noto Serif TC',serif;font-size:18px;font-weight:700}
.stats{display:flex;gap:8px}
.stat{background:rgba(255,255,255,.7);border:1px solid rgba(200,170,110,.3);border-radius:10px;padding:7px 15px;text-align:center;min-width:70px}
.stat .n{font-family:'Noto Serif TC',serif;font-size:26px;font-weight:700;line-height:1.15}
.stat .l{font-size:12px;color:var(--muted)}
.stat.in .n{color:var(--ok)}
.stat.left .n{color:var(--gold)}
.sec-label{font-size:16px;font-weight:700;color:var(--gold);margin:6px 2px 10px;display:flex;align-items:center;gap:8px}
.sec-label::before{content:'';width:20px;height:2px;background:var(--gold-lt);border-radius:2px}
#cam-wrap{position:relative;border-radius:18px;overflow:hidden;border:1px solid rgba(200,170,110,.35);background:#111;box-shadow:0 8px 30px rgba(140,110,60,.14);min-height:260px;display:flex;align-items:center;justify-content:center;flex-direction:column}
#cam-video{width:100%;display:none;border-radius:18px}
#cam-guide{position:absolute;width:200px;height:200px;border:3px solid rgba(169,135,79,.85);border-radius:16px;box-shadow:0 0 0 9999px rgba(0,0,0,.3);display:none;pointer-events:none}
#cam-status{padding:30px 20px;text-align:center;color:#fff;font-size:16px;line-height:1.9}
#cam-canvas{display:none}
.btn-gold{font-family:inherit;font-size:17px;font-weight:700;color:#fff;padding:13px 30px;border:none;border-radius:12px;cursor:pointer;background:linear-gradient(135deg,var(--gold-lt),var(--gold));margin-top:10px}
.scanhint{text-align:center;color:var(--muted);font-size:15px;margin:10px 0 4px}
.or{display:flex;align-items:center;gap:14px;margin:24px 2px 18px;color:var(--muted);font-size:15px}
.or::before,.or::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(200,170,110,.5),transparent)}
input[type=search]{width:100%;font-family:inherit;font-size:20px;color:var(--ink);padding:16px 18px;border:1.5px solid rgba(180,150,100,.4);border-radius:14px;background:rgba(255,255,255,.85)}
input[type=search]:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(168,135,79,.16)}
.list{margin-top:14px}
.row{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.74);border:1px solid rgba(200,170,110,.28);border-radius:14px;padding:15px 16px;margin-bottom:10px}
.row .info{flex:1;min-width:0}
.row .nm{font-weight:700;font-size:20px}
.row .meta{font-size:14px;color:var(--muted);margin-top:2px}
.row button{flex-shrink:0;font-family:inherit;font-size:17px;font-weight:700;color:#fff;padding:12px 22px;border:none;border-radius:11px;cursor:pointer;background:linear-gradient(135deg,var(--gold-lt),var(--gold))}
.row button:active{transform:translateY(1px)}
.row.done{background:rgba(74,124,89,.08);border-color:rgba(74,124,89,.3)}
.row .tag{flex-shrink:0;font-size:15px;font-weight:700;color:var(--ok);text-align:right;line-height:1.4}
.empty{text-align:center;color:var(--muted);padding:26px 0;font-size:16px}
#pop{position:fixed;inset:0;background:rgba(40,32,22,.55);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:24px;z-index:99}
#pop.on{display:flex}
.pop-card{width:100%;max-width:400px;background:var(--cream);border-radius:22px;padding:36px 26px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .22s cubic-bezier(.2,1.2,.4,1)}
@keyframes pop{from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}
.pop-ico{width:80px;height:80px;margin:0 auto 18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:42px}
.ok .pop-ico{background:rgba(74,124,89,.14);color:var(--ok);border:2px solid var(--ok)}
.dup .pop-ico{background:rgba(192,138,62,.14);color:var(--warn);border:2px solid var(--warn)}
.no .pop-ico{background:rgba(181,84,75,.12);color:var(--err);border:2px solid var(--err)}
.pop-nm{font-family:'Noto Serif TC',serif;font-size:34px;font-weight:700;margin-bottom:10px}
.pop-badges{display:flex;justify-content:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.badge{display:inline-block;padding:5px 16px;border-radius:20px;font-size:16px;font-weight:700}
.badge-meal{background:rgba(74,124,89,.12);color:var(--ok);border:1px solid rgba(74,124,89,.35)}
.badge-lb{background:rgba(181,84,75,.12);color:#b04030;border:1px solid rgba(181,84,75,.35);font-size:18px}
.pop-msg{font-size:19px;line-height:1.7}
.ok .pop-msg{color:var(--ok);font-weight:700}
.dup .pop-msg{color:var(--warn)}
.no .pop-msg{color:var(--err)}
.pop-card button{width:100%;margin-top:28px;font-family:inherit;font-size:20px;font-weight:700;letter-spacing:.1em;color:#fff;padding:17px;border:none;border-radius:13px;cursor:pointer;background:linear-gradient(135deg,var(--gold-lt),var(--gold))}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="top-title" id="evtTitle">海德堡讀書會報到</div>
    <div class="stats">
      <div class="stat in"><div class="n" id="s-in">0</div><div class="l">已報到</div></div>
      <div class="stat left"><div class="n" id="s-left">0</div><div class="l">未到</div></div>
    </div>
  </div>
  <div class="sec-label">掃描 QR Code 報到</div>
  <div id="cam-wrap">
    <video id="cam-video" playsinline autoplay muted></video>
    <div id="cam-guide"></div>
    <canvas id="cam-canvas"></canvas>
    <div id="cam-status">
      <div style="font-size:40px;margin-bottom:10px">&#128247;</div>
      <button class="btn-gold" onclick="startCamera()">開啟相機掃描</button>
      <div style="font-size:12px;opacity:.55;margin-top:8px">請使用 Chrome 瀏覽器開啟</div>
    </div>
  </div>
  <p class="scanhint">出示手機上的會員 QR Code 對準鏡頭</p>
  <div class="or">沒帶 QR？用姓名搜尋</div>
  <input type="search" id="q" placeholder="輸入姓名或電話…" oninput="doSearch()" autocomplete="off">
  <div class="list" id="list"><div class="empty">輸入姓名或電話搜尋</div></div>
</div>
<div id="pop" onclick="closePop()">
  <div class="pop-card" id="popCard" onclick="event.stopPropagation()">
    <div class="pop-ico" id="popIco"></div>
    <div class="pop-nm" id="popNm"></div>
    <div class="pop-badges" id="popBadges"></div>
    <div class="pop-msg" id="popMsg"></div>
    <button onclick="closePop()">繼續報到</button>
  </div>
</div>
<script>
var API = 'https://script.google.com/macros/s/AKfycbx8wYkMnToVxSSwK0YxC-Ki99-h-W3_VVKhHwbpUgpLVcIyjD_RJ-SYAW85hd1e_8-J0g/exec';

function getEl(id) { return document.getElementById(id); }

var busy = false;
var lastCode = '';
var lastAt = 0;
var scanLoop = null;
var detector = null;

// Load event name
fetch(API + '?action=info')
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (d.ok && d.config && d.config.eventName) {
      getEl('evtTitle').textContent = d.config.eventName + ' 報到';
    }
  })
  .catch(function() {});

// ── Camera ────────────────────────────────────────────────
function setStatus(html) {
  getEl('cam-status').style.display = 'block';
  getEl('cam-status').innerHTML = html;
  getEl('cam-video').style.display = 'none';
  getEl('cam-guide').style.display = 'none';
  if (scanLoop) { clearInterval(scanLoop); scanLoop = null; }
}

function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setStatus('<div style="font-size:30px;margin-bottom:8px">&#9888;&#65039;</div>此瀏覽器不支援相機<br><small>請用 Chrome 開啟</small>');
    return;
  }
  setStatus('<div style="font-size:30px;margin-bottom:8px">&#128247;</div>正在啟動相機…');

  var timer = setTimeout(function() {
    setStatus('<div style="font-size:30px;margin-bottom:8px">&#9888;&#65039;</div>相機啟動逾時<br><small>請在 Chrome 中開啟此頁面</small><br><button class="btn-gold" onclick="startCamera()" style="margin-top:12px">重試</button>');
  }, 8000);

  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
    .then(function(stream) {
      clearTimeout(timer);
      var vid = getEl('cam-video');
      vid.srcObject = stream;
      vid.onloadedmetadata = function() {
        vid.play();
        getEl('cam-status').style.display = 'none';
        vid.style.display = 'block';
        getEl('cam-guide').style.display = 'block';
        initDetector();
        startScanLoop();
      };
    })
    .catch(function(err) {
      clearTimeout(timer);
      var msg = '相機無法開啟';
      if (err.name === 'NotAllowedError') { msg = '請允許相機權限'; }
      else if (err.name === 'NotReadableError') { msg = '相機被其他 App 佔用<br><small>請關閉其他使用相機的程式</small>'; }
      else if (err.name === 'NotFoundError') { msg = '找不到相機裝置'; }
      setStatus('<div style="font-size:30px;margin-bottom:8px">&#9888;&#65039;</div>' + msg + '<br><button class="btn-gold" onclick="startCamera()" style="margin-top:12px">重試</button>');
    });
}

function initDetector() {
  if (typeof BarcodeDetector !== 'undefined') {
    try { detector = new BarcodeDetector({ formats: ['qr_code'] }); } catch(e) { detector = null; }
  }
  if (!detector && typeof jsQR === 'undefined') {
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js';
    document.head.appendChild(s);
  }
}

function startScanLoop() {
  var vid = getEl('cam-video');
  var canvas = getEl('cam-canvas');
  scanLoop = setInterval(function() {
    if (!vid || vid.readyState < 2 || vid.videoWidth === 0) { return; }
    if (detector) {
      detector.detect(vid).then(function(codes) {
        if (codes.length > 0) { onQR(codes[0].rawValue); }
      }).catch(function() {});
    } else if (typeof jsQR !== 'undefined') {
      canvas.width = vid.videoWidth;
      canvas.height = vid.videoHeight;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(vid, 0, 0);
      var img = ctx.getImageData(0, 0, canvas.width, canvas.height);
      var code = jsQR(img.data, img.width, img.height);
      if (code) { onQR(code.data); }
    }
  }, 250);
}

function onQR(text) {
  var now = Date.now();
  if (busy) { return; }
  if (text === lastCode && now - lastAt < 3000) { return; }
  lastCode = text;
  lastAt = now;
  // Show raw QR content for debugging
  alert('QR 內容：[' + text + ']');
  doCheckIn(text.trim());
}

// ── Check-in ──────────────────────────────────────────────
function doCheckIn(id) {
  busy = true;
  fetch(API + '?action=event_checkin&phone=' + encodeURIComponent(id))
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.ok) {
        buzz([40, 60, 40]);
        var badges = '';
        if (d.meal && d.meal !== '不用餐') {
          badges += '<span class="badge badge-meal">' + escHtml(d.meal) + '</span>';
        }
        if (d.lunchbox && d.lunchbox !== '0') {
          badges += '<span class="badge badge-lb">&#x1F371; x' + escHtml(d.lunchbox) + '</span>';
        }
        showPop('ok', '✓', d.name, '&#x5831;&#x5230;&#x5B8C;&#x6210;&#xFF01;', badges);
        setTimeout(closePop, 3000);
      } else {
        buzz([200]);
        showPop('no', '✕', d.msg || '&#x67E5;&#x7121;&#x6B64;&#x4EBA;', '&#x8ACB;&#x6539;&#x7528;&#x4E0B;&#x65B9;&#x641C;&#x5C0B;&#x59D3;&#x540D;', '');
      }
      refreshStats();
    })
    .catch(function() {
      showPop('no', '✕', '&#x9023;&#x7DDA;&#x5931;&#x6557;', '&#x8ACB;&#x6AA2;&#x67E5;&#x7DB2;&#x8DEF;', '');
    })
    .finally(function() { busy = false; });
}

// ── Name search ───────────────────────────────────────────
var searchTimer = null;
function doSearch() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(runSearch, 300);
}

function runSearch() {
  var q = getEl('q').value.trim();
  if (!q) {
    getEl('list').innerHTML = '<div class="empty">&#x8F38;&#x5165;&#x59D3;&#x540D;&#x6216;&#x96FB;&#x8A71;&#x641C;&#x5C0B;</div>';
    return;
  }
  fetch(API + '?action=event_search&q=' + encodeURIComponent(q))
    .then(function(r) { return r.json(); })
    .then(function(d) { renderList(d.results || []); })
    .catch(function() { getEl('list').innerHTML = '<div class="empty">&#x9023;&#x7DDA;&#x5931;&#x6557;</div>'; });
}

function renderList(rows) {
  if (!rows.length) {
    getEl('list').innerHTML = '<div class="empty">&#x67E5;&#x7121;&#x6B64;&#x4EBA;</div>';
    return;
  }
  var html = '';
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    var meta = '';
    if (r.meal) { meta += r.meal; }
    if (r.lunchbox && r.lunchbox !== '0') { meta += (meta ? ' ・ ' : '') + '&#x52A0;&#x8CFC;&#x4FBF;&#x7576;' + r.lunchbox + '&#x500B;'; }
    var phone = maskPhone(String(r.phone || ''));
    if (r.checkedIn) {
      html += '<div class="row done"><div class="info"><div class="nm">' + escHtml(r.name) + '</div><div class="meta">' + phone + (meta ? ' ・ ' + meta : '') + '</div></div><div class="tag">&#x2713; &#x5DF2;&#x5831;&#x5230;</div></div>';
    } else {
      html += '<div class="row"><div class="info"><div class="nm">' + escHtml(r.name) + '</div><div class="meta">' + phone + (meta ? ' ・ ' + meta : '') + '</div></div><button onclick="manualCheckin(\'' + escAttr(String(r.phone || '')) + '\')">&#x5831;&#x5230;</button></div>';
    }
  }
  getEl('list').innerHTML = html;
}

function manualCheckin(id) {
  doCheckIn(id);
  setTimeout(runSearch, 800);
}

// ── Stats ─────────────────────────────────────────────────
function refreshStats() {
  fetch(API + '?action=event_stats')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.ok) {
        getEl('s-in').textContent = d.checked;
        getEl('s-left').textContent = d.unchecked;
      }
    })
    .catch(function() {});
}

// ── Popup ─────────────────────────────────────────────────
function showPop(cls, ico, nm, msg, badges) {
  getEl('popCard').className = 'pop-card ' + cls;
  getEl('popIco').textContent = ico;
  getEl('popNm').textContent = nm;
  getEl('popMsg').innerHTML = msg;
  getEl('popBadges').innerHTML = badges || '';
  getEl('pop').classList.add('on');
}
function closePop() { getEl('pop').classList.remove('on'); }

// ── Helpers ───────────────────────────────────────────────
function buzz(p) { if (navigator.vibrate) { navigator.vibrate(p); } }

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function escAttr(s) {
  return String(s).replace(/'/g, '&#39;');
}

function maskPhone(p) {
  if (p.length > 6) { return p.slice(0, 4) + '***' + p.slice(-3); }
  return p;
}

refreshStats();
setInterval(refreshStats, 20000);
</script>
</body>
</html>
