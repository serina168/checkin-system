<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>現場報到 — 海德堡讀書會</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--gold:#a8874f;--gold-lt:#c9a86a;--cream:#faf6ef;--ink:#3d3226;--muted:#8a7a63;--ok:#4a7c59;--warn:#c08a3e;--err:#b5544b}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans TC',sans-serif;background:var(--cream);color:var(--ink);font-size:18px;line-height:1.6;padding:14px 14px 60px;min-height:100vh}
.wrap{max-width:520px;margin:0 auto}

/* 頂部 */
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 16px;gap:12px}
.top-title{font-family:'Noto Serif TC',serif;font-size:17px;font-weight:700;color:var(--ink)}
.stats{display:flex;gap:8px}
.stat{background:#fff;border:1px solid rgba(200,170,110,.3);border-radius:10px;padding:6px 14px;text-align:center;min-width:66px}
.stat .n{font-family:'Noto Serif TC',serif;font-size:24px;font-weight:700;line-height:1.2}
.stat .l{font-size:11px;color:var(--muted)}
.stat.in .n{color:var(--ok)}
.stat.left .n{color:var(--gold)}

/* 搜尋區 */
.search-wrap{position:relative;margin-bottom:6px}
.search-wrap input{width:100%;font-family:inherit;font-size:22px;color:var(--ink);padding:18px 56px 18px 20px;border:2px solid rgba(168,135,79,.35);border-radius:16px;background:#fff;transition:border-color .15s,box-shadow .15s}
.search-wrap input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(168,135,79,.14)}
.search-wrap input::placeholder{color:#c0b09a}
.clear-btn{position:absolute;right:16px;top:50%;transform:translateY(-50%);background:rgba(180,160,120,.2);border:none;border-radius:50%;width:32px;height:32px;font-size:16px;cursor:pointer;display:none;align-items:center;justify-content:center;color:var(--muted)}
.clear-btn.show{display:flex}
.search-hint{font-size:13px;color:var(--muted);text-align:center;margin:6px 0 14px}

/* 結果列表 */
.list{margin-top:4px}
.row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid rgba(200,170,110,.28);border-radius:14px;padding:14px 16px;margin-bottom:8px;transition:background .15s}
.row.first-row{border-color:rgba(168,135,79,.5);box-shadow:0 2px 12px rgba(168,135,79,.12)}
.row .info{flex:1;min-width:0}
.row .nm{font-weight:700;font-size:21px;line-height:1.3}
.row .meta{font-size:13px;color:var(--muted);margin-top:2px}
.row .checkin-btn{flex-shrink:0;font-family:inherit;font-size:16px;font-weight:700;color:#fff;padding:12px 22px;border:none;border-radius:11px;cursor:pointer;background:linear-gradient(135deg,var(--gold-lt),var(--gold));transition:transform .1s,opacity .1s}
.row .checkin-btn:active{transform:translateY(1px);opacity:.9}
.row.done{background:rgba(74,124,89,.06);border-color:rgba(74,124,89,.25)}
.row .tag{flex-shrink:0;font-size:14px;font-weight:700;color:var(--ok);text-align:right;line-height:1.5}
.loading{text-align:center;color:var(--muted);padding:24px 0;font-size:15px}
.empty{text-align:center;color:var(--muted);padding:24px 0;font-size:15px}

/* QR 拍照（次要） */
.qr-toggle{text-align:center;margin:20px 0 10px}
.qr-toggle button{font-family:inherit;font-size:14px;color:var(--muted);background:none;border:1px solid rgba(168,135,79,.3);border-radius:20px;padding:7px 18px;cursor:pointer}
.qr-box{display:none;background:#111;border-radius:16px;padding:28px 20px;text-align:center;margin-bottom:4px}
.qr-box.open{display:block}
.qr-box label{display:inline-block;font-family:inherit;font-size:17px;font-weight:700;color:#fff;padding:14px 30px;border-radius:12px;cursor:pointer;background:linear-gradient(135deg,var(--gold-lt),var(--gold))}
.qr-box .hint{color:rgba(255,255,255,.4);font-size:12px;margin-top:10px}
#photo-preview{display:none;width:100%;border-radius:10px;margin-top:12px}
#photo-hint{color:#f90;font-size:13px;margin-top:8px}

/* 彈窗 */
#pop{position:fixed;inset:0;background:rgba(40,32,22,.55);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:24px;z-index:99}
#pop.on{display:flex}
.pop-card{width:100%;max-width:400px;background:var(--cream);border-radius:22px;padding:36px 26px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .22s cubic-bezier(.2,1.2,.4,1)}
@keyframes pop{from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}
.pop-ico{width:80px;height:80px;margin:0 auto 18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:42px}
.ok .pop-ico{background:rgba(74,124,89,.14);color:var(--ok);border:2px solid var(--ok)}
.dup .pop-ico{background:rgba(192,138,62,.14);color:var(--warn);border:2px solid var(--warn)}
.no .pop-ico{background:rgba(181,84,75,.12);color:var(--err);border:2px solid var(--err)}
.pop-nm{font-family:'Noto Serif TC',serif;font-size:32px;font-weight:700;margin-bottom:10px}
.pop-badges{display:flex;justify-content:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.badge{display:inline-block;padding:5px 16px;border-radius:20px;font-size:15px;font-weight:700}
.badge-meal{background:rgba(74,124,89,.12);color:var(--ok);border:1px solid rgba(74,124,89,.35)}
.badge-lb{background:rgba(181,84,75,.12);color:#b04030;border:1px solid rgba(181,84,75,.35)}
.pop-msg{font-size:18px;line-height:1.7}
.ok .pop-msg{color:var(--ok);font-weight:700}
.dup .pop-msg{color:var(--warn)}
.no .pop-msg{color:var(--err)}
.pop-card button{width:100%;margin-top:24px;font-family:inherit;font-size:19px;font-weight:700;color:#fff;padding:16px;border:none;border-radius:13px;cursor:pointer;background:linear-gradient(135deg,var(--gold-lt),var(--gold))}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="top-title" id="evtTitle">海德堡讀書會報到</div>
    <div class="stats">
      <div class="stat in"><div class="n" id="s-in">0</div><div class="l">已報到</div></div>
      <div class="stat left"><div class="n" id="s-left">0</div><div class="l">未到</div></div>
    </div>
  </div>

  <div class="search-wrap">
    <input type="search" id="q" placeholder="輸入姓名或電話…" oninput="onInput()" onkeydown="onKey(event)" autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="clear-btn" id="clear-btn" onclick="clearSearch()">✕</button>
  </div>
  <div class="search-hint" id="search-hint">輸入姓名或電話快速搜尋</div>
  <div class="list" id="list"></div>

  <div class="qr-toggle">
    <button onclick="toggleQR()">📷 改用拍照掃描 QR Code</button>
  </div>
  <div class="qr-box" id="qr-box">
    <label>
      拍照掃描
      <input type="file" accept="image/*" capture="environment" style="display:none" onchange="photoScan(this)">
    </label>
    <div class="hint">對準 QR Code 拍照後自動報到</div>
    <img id="photo-preview" alt="">
    <div id="photo-hint"></div>
  </div>
</div>

<div id="pop" onclick="closePop()">
  <div class="pop-card" id="popCard" onclick="event.stopPropagation()">
    <div class="pop-ico" id="popIco"></div>
    <div class="pop-nm" id="popNm"></div>
    <div class="pop-badges" id="popBadges"></div>
    <div class="pop-msg" id="popMsg"></div>
    <button onclick="closePop()">繼續報到</button>
  </div>
</div>

<script>
var API = 'https://script.google.com/macros/s/AKfycbx8wYkMnToVxSSwK0YxC-Ki99-h-W3_VVKhHwbpUgpLVcIyjD_RJ-SYAW85hd1e_8-J0g/exec';
function $(id) { return document.getElementById(id); }
var busy = false, searchTimer = null, lastResults = [];

fetch(API + '?action=info', {redirect:'follow'})
  .then(function(r){return r.json();})
  .then(function(d){
    if (d.ok && d.config && d.config.eventName) {
      $('evtTitle').textContent = d.config.eventName + ' 報到';
    }
  }).catch(function(){});

/* 搜尋 */
function onInput() {
  var q = $('q').value;
  $('clear-btn').classList.toggle('show', q.length > 0);
  clearTimeout(searchTimer);
  if (!q.trim()) {
    $('search-hint').textContent = '輸入姓名或電話快速搜尋';
    $('list').innerHTML = '';
    lastResults = [];
    return;
  }
  $('search-hint').textContent = '搜尋中…';
  $('list').innerHTML = '<div class="loading">搜尋中…</div>';
  searchTimer = setTimeout(runSearch, 250);
}

function onKey(e) {
  if (e.key === 'Enter' && lastResults.length > 0 && !lastResults[0].checkedIn) {
    e.preventDefault();
    doCheckIn(String(lastResults[0].phone || ''));
  }
}

function clearSearch() {
  $('q').value = '';
  $('q').focus();
  $('clear-btn').classList.remove('show');
  $('search-hint').textContent = '輸入姓名或電話快速搜尋';
  $('list').innerHTML = '';
  lastResults = [];
}

function runSearch() {
  var q = $('q').value.trim();
  if (!q) { return; }
  fetch(API + '?action=event_search&q=' + encodeURIComponent(q), {redirect:'follow'})
    .then(function(r){return r.json();})
    .then(function(d){
      lastResults = d.results || [];
      renderList(lastResults);
      $('search-hint').textContent = lastResults.length ? '共 ' + lastResults.length + ' 筆　按 Enter 或點「報到」' : '';
    })
    .catch(function(){
      $('list').innerHTML = '<div class="empty">連線失敗，請重試</div>';
      $('search-hint').textContent = '';
    });
}

function renderList(rows) {
  if (!rows.length) {
    $('list').innerHTML = '<div class="empty">查無此人</div>';
    return;
  }
  var html = '';
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    var meta = r.meal || '';
    if (r.lunchbox && r.lunchbox !== '0') { meta += (meta ? ' ・ ' : '') + '便當×' + r.lunchbox; }
    var ph = maskPhone(String(r.phone || ''));
    var cls = 'row' + (r.checkedIn ? ' done' : '') + (i === 0 ? ' first-row' : '');
    if (r.checkedIn) {
      html += '<div class="' + cls + '"><div class="info"><div class="nm">' + escHtml(r.name) + '</div><div class="meta">' + ph + (meta ? '　' + meta : '') + '</div></div><div class="tag">✓ 已報到</div></div>';
    } else {
      html += '<div class="' + cls + '"><div class="info"><div class="nm">' + escHtml(r.name) + '</div><div class="meta">' + ph + (meta ? '　' + meta : '') + '</div></div><button class="checkin-btn" onclick="manualCheckin(\'' + escAttr(String(r.phone||'')) + '\')">報到</button></div>';
    }
  }
  $('list').innerHTML = html;
}

function manualCheckin(id) {
  doCheckIn(id);
  setTimeout(runSearch, 900);
}

/* 報到 */
function doCheckIn(id) {
  if (busy || !id) { return; }
  busy = true;
  fetch(API + '?action=event_checkin&phone=' + encodeURIComponent(id), {redirect:'follow'})
    .then(function(r){return r.json();})
    .then(function(d){
      if (d.ok) {
        buzz([40,60,40]);
        var isBday = false;
        if (d.birthday) {
          var m = String(d.birthday).match(/(\d+)月/);
          if (m && parseInt(m[1]) === new Date().getMonth()+1) isBday = true;
        }
        var badges = '';
        if (isBday) badges += '<span class="badge" style="background:#e6a817;color:#fff">🎂 本月壽星</span>';
        if (d.meal && d.meal !== '不用餐') badges += '<span class="badge badge-meal">' + escHtml(d.meal) + '</span>';
        if (d.lunchbox && d.lunchbox !== '0') badges += '<span class="badge badge-lb">🍱 ×' + escHtml(String(d.lunchbox)) + '</span>';
        var subMsg = isBday ? '🎉 生日快樂！報到完成！' : '報到完成！';
        showPop('ok', isBday ? '🎂' : '✓', escHtml(d.name), subMsg, badges);
        setTimeout(function() { closePop(); clearSearch(); $('q').focus(); }, isBday ? 4000 : 2500);
      } else {
        buzz([200]);
        showPop('no', '✕', escHtml(d.msg || '查無此人'), '請確認姓名或電話', '');
      }
      refreshStats();
    })
    .catch(function(){showPop('no','✕','連線失敗','請檢查網路','');})
    .finally(function(){busy = false;});
}

/* 統計 */
function refreshStats() {
  fetch(API + '?action=event_stats', {redirect:'follow'})
    .then(function(r){return r.json();})
    .then(function(d){
      if (d.ok) { $('s-in').textContent = d.checked; $('s-left').textContent = d.unchecked; }
    }).catch(function(){});
}

/* QR 拍照 */
function toggleQR() {
  $('qr-box').classList.toggle('open');
}

function photoScan(input) {
  var file = input.files[0];
  input.value = '';
  if (!file) { return; }
  var preview = $('photo-preview');
  preview.src = URL.createObjectURL(file);
  preview.style.display = 'block';
  $('photo-hint').textContent = '解碼中…';
  var tmpDiv = document.createElement('div');
  tmpDiv.id = 'qr-tmp-' + Date.now();
  tmpDiv.style.display = 'none';
  document.body.appendChild(tmpDiv);
  var scanner = new Html5Qrcode(tmpDiv.id);
  scanner.scanFileV2(file, false)
    .then(function(result) {
      var text = (result.decodedText || '').trim();
      document.body.removeChild(tmpDiv);
      if (text) {
        preview.style.display = 'none';
        $('photo-hint').textContent = '';
        $('qr-box').classList.remove('open');
        doCheckIn(text);
      } else {
        $('photo-hint').textContent = '讀取失敗，請重拍（QR Code 需佔畫面大部分且清晰）';
      }
    })
    .catch(function() {
      document.body.removeChild(tmpDiv);
      $('photo-hint').textContent = '讀取失敗，請重拍（QR Code 需佔畫面大部分且清晰）';
    });
}

/* 彈窗 */
function showPop(cls, ico, nm, msg, badges) {
  $('popCard').className = 'pop-card ' + cls;
  $('popIco').textContent = ico;
  $('popNm').innerHTML = nm;
  $('popMsg').innerHTML = msg;
  $('popBadges').innerHTML = badges || '';
  $('pop').classList.add('on');
}
function closePop() { $('pop').classList.remove('on'); }
function buzz(p) { if (navigator.vibrate) navigator.vibrate(p); }
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s) { return String(s).replace(/'/g,'&#39;'); }
function maskPhone(p) { return p.length > 6 ? p.slice(0,4) + '***' + p.slice(-3) : p; }

/* 啟動 */
refreshStats();
setInterval(refreshStats, 20000);
(function() {
  var p = new URLSearchParams(window.location.search).get('p');
  if (p && p.trim()) {
    doCheckIn(p.trim());
  } else {
    setTimeout(function(){ $('q').focus(); }, 400);
  }
})();
</script>
</body>
</html>
